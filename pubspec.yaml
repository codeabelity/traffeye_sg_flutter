name: traffeye_sg_flutter
description: A new Flutter project.
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  collection: ^1.19.1
  device_preview: ^1.3.1
  dot_navigation_bar: ^1.0.2
  drag_and_drop_lists: ^0.4.2
  draggable_bottom_sheet: ^1.0.2
  either_dart: ^1.0.0
  equatable: ^2.0.7
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  flutter_scroll_shadow: ^1.2.6
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.1
  geocoding: ^4.0.0
  get: ^4.7.2
  google_fonts: ^6.3.2
  google_maps_flutter: ^2.13.1
  hive: ^2.2.3
  http: ^1.5.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  simple_rich_text: ^2.0.49
  timeago: ^3.7.1
  url_launcher: ^6.3.2

dependency_overrides:
  win32: ^5.5.0  

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  flutter_lints: ^3.0.0
  mockito: ^5.4.2
  test: ^1.24.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/filled/
    - assets/vectors/images/
    - assets/vectors/outlined/
    - assets/style/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/img_app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/img_app_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/img_app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/img_app_icon.png"